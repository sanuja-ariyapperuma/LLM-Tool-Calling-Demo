services:
  ollama:
    image: ollama/ollama:0.40.2
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # Runs once: downloads the model, then exits. A second run is a quick no-op.
  ollama-pull:
    image: ollama/ollama:0.40.2
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen3.5:4b"]
    restart: "no"

  web:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Default: "Data Source=/app/data/finguitar.db"
      Llm__Provider: "Ollama"
      Llm__Endpoint: "http://ollama:11434"
      Llm__Model: "qwen3.5:4b"
      Llm__TimeoutSeconds: "180"
      ASPNETCORE_ENVIRONMENT: Production
      TZ: ${TZ:-UTC}
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
  ollama-models:
